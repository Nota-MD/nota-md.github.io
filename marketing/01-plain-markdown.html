<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Nota promo 01</title>
    <link rel="stylesheet" href="promo.css">
  </head>
  <body>
    <div class="poster slide-1">
      <div class="grid"></div>
      <div class="noise"></div>
      <main class="content">
        <div class="topline">
          <div class="brand">
            <img class="brand-icon" src="../assets/nota.svg" alt="">
            <div class="wordmark"></div>
          </div>
          <div class="step"><strong>01</strong><span>/ 03</span></div>
        </div>

        <header class="headline">
          <p class="kicker">Local-first by default</p>
          <h1>Markdown，<br><em>不加壳。</em></h1>
          <p class="subhead">你写下的每个字，保存后仍然是普通 `.md` 文件。</p>
        </header>

        <section class="stage">
          <div class="shot-frame back-shot">
            <img src="../assets/nota-settings.png" alt="">
          </div>
          <div class="shot-frame main-shot">
            <img src="../assets/nota-yaru.png" alt="">
          </div>
          <div class="file-badge">document.md</div>
          <div class="code-card">
            <div class="tab"><i></i><i></i><i></i></div>
            <pre><b>#</b> 写下来的想法

Nota 保存的是
<b>纯 Markdown</b>。

<b>-</b> 没有私有数据库
<b>-</b> 没有隐藏格式
<b>-</b> 随时可以带走</pre>
          </div>
          <div class="stats">
            <div class="stat"><strong>1</strong><span>个文件</span></div>
            <div class="stat"><strong>0</strong><span>私有格式</span></div>
            <div class="stat"><strong>.md</strong><span>始终可读</span></div>
          </div>
        </section>

        <footer class="footer">
          <span class="tagline">NOTA · PLAIN FILES, REAL DOCUMENTS</span>
          <div class="progress"><i class="on"></i><i></i><i></i></div>
        </footer>
      </main>
    </div>
  </body>
</html>
