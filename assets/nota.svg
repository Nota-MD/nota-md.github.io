<!--
  Nota 图标 · 矢量母版（**唯一的手写源**，其余图标都由它派生）

  # 这一版（2026-10-16）：斜纹 N

  用户新画的一版，原文件在下载目录（`monoton_n.svg`，2026-10-16 19:43）。
  画的是「浅色圆角卡片 ＋ 一条由斜纹拼成的 N」，比上一版（折角纸 ＋ N ＋
  蓝色光标条 ＋ 三行文字）**简单得多**：没有纸、没有光标、没有那三行小字，
  16 / 32 像素下仍然认得出。

  ⚠️⚠️ **只动了一处：把那张白底 `rect` 删了。**
  原件第二行是一条铺满画布的 `<rect width="1254" height="1254" fill="#ffffff"/>`
  ——在它自己的预览里看不出来，但它让整张图**四角是不透明的白**
  （实测：`(0,0)` ＝ `rgba(254,254,254,255)`）。落到 Windows 开始菜单 /
  任务栏上就是一块白方块（用户朋友 2026-10-11 报的「图标裁切问题：
  没有裁切好透明底」）。现在卡片外面是**真的透明**（`alpha = 0`）。
  ⚠️ 别再往这儿补任何底色 —— 要底色该由**外壳**给（Windows 会自己配瓷砖），
  不该由图标自带。

  # 出图两步（见 `docs/06` §2.4「图标」）

  ⚠️ `width="100%" height="100%"` ＋ `viewBox` 是**必须的写法**：给死像素
  （原件写的是 `width="1254" height="1254"`）时 Chrome 会**按原尺寸画完再裁**，
  512 的窗口里出一张被裁掉一角的图（实拍过）。这一条是老母版留下的，
  换图时**别丢**。

  ⚠️ Chrome 无头截图**总会给一张白底**（那个 "default background color" 开关
  在新无头模式下不生效，实测），所以那一步出来的 PNG 四角是白的——
  出图脚本里**跟着补一刀**把外面那圈白抠成透明（`docs/06` §2.4 那条命令里
  写着怎么做）。
-->
